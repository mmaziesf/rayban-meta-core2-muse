; Core2 v1.1 firmware: shows the Ray-Ban Meta stream relayed by glasses-bridge/pc/viewer.py.
; Factory firmware backup and restore: ../core2-firmware-backup/

[env:core2]
platform = espressif32@7.1.3
board = m5stack-core2
framework = arduino
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  m5stack/M5Unified@0.2.23
  links2004/WebSockets@2.7.3
  bblanchon/ArduinoJson@7.3.2
